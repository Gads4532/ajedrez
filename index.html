<!doctype html>
<html lang="es">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1f1e1b">
<link rel="icon" type="image/png" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="description" content="Academia de ajedrez gratuita: puzles con rating, aperturas, estrategia, finales, metodologías profesionales y Stockfish 19.">
<meta charset="utf-8">
<title>Ajedrez Pro Academia</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800;900&display=swap">
<style>
/* Layout: barra lateral de navegación oscura + área principal con tablero a la izquierda y panel a la derecha (estilo plataforma de juego online). Un solo tema oscuro deliberado. */
:root{
  --bg:#302e2b; --bg2:#262522; --bg3:#1f1e1b; --panel:#262522; --line:#3c3a37; --hover:#3a3835;
  --fg:#ffffff; --fg2:#c3c2c1; --fg3:#8b8987;
  --accent:#81b64c; --accent-d:#45753c; --accent-h:#95c95f;
  --green:#81b64c; --green-d:#45753c; --green-h:#95c95f;
  --gray-btn:#3d3b38; --gray-btn-d:#2a2926;
  --red:#ca3431; --yellow:#f0c15c; --blue:#5c8bb0; --teal:#1baca6;
  --sq-l:#ebecd0; --sq-d:#739552; --last:rgba(255,255,51,.5); --sel:rgba(255,255,51,.5); --coord-l:#739552; --coord-d:#ebecd0;
  --f-ui:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:6px;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:15px;line-height:1.5;margin:0;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button{font-family:inherit}
a{color:var(--green-h)}
h1,h2,h3,h4{margin:0;line-height:1.2;text-wrap:balance}
:focus-visible{outline:2px solid var(--green-h);outline-offset:2px}

/* ---------- Estructura ---------- */
.app{display:flex;min-height:100%}
.side{width:160px;flex:none;background:var(--bg3);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;padding-left:env(safe-area-inset-left,0px);z-index:20}
.logo{display:flex;align-items:center;gap:8px;padding:14px 12px 10px;font-weight:900;font-size:17px;white-space:nowrap;letter-spacing:-.3px;color:var(--fg);text-decoration:none}
.logo .lg{width:32px;height:32px;background:var(--green);border-radius:9px;display:grid;place-items:center}
.logo .lg svg{width:20px;height:20px}
.logo small{display:block;font-size:10px;font-weight:700;color:var(--green-h);letter-spacing:1.5px;text-transform:uppercase}
.nav{display:flex;flex-direction:column;padding:4px 0 16px}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 12px;color:var(--fg2);text-decoration:none;font-weight:700;font-size:14.5px;border-left:3px solid transparent;transition:background .12s,color .12s}
.nav a:hover{background:var(--hover);color:var(--fg)}
.nav a.on{background:var(--bg2);color:var(--fg);border-left-color:var(--green)}
.nav .ic{width:26px;height:26px;flex:none;display:grid;place-items:center}
.nav .ic svg{width:26px;height:26px}
.nav .lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:1.4px;color:var(--fg3);padding:10px 15px 2px;font-weight:800}
.side-foot{margin-top:auto;padding:10px 12px 14px;color:var(--fg3);font-size:12.5px;border-top:1px solid var(--line)}
.side-foot b{color:var(--fg)}
main{flex:1;min-width:0;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1240px;margin:0 auto}
#view>*{animation:viewin .26s cubic-bezier(.22,1,.36,1)}
@keyframes viewin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.btn{transition:filter .12s,transform .08s}
.tile,.list-row{transition:background .15s,transform .15s}
.tile:hover{transform:translateY(-2px)}
.moves .m{transition:background .15s,color .15s}
.topbar{display:none}

/* ---------- Botones ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:var(--r);padding:10px 18px;font-weight:800;font-size:15px;cursor:pointer;color:#fff;background:var(--gray-btn);box-shadow:0 4px 0 var(--gray-btn-d);transition:filter .12s;text-decoration:none;white-space:nowrap;position:relative;top:0}
.btn:hover{filter:brightness(1.12)}
.btn:active{top:2px;box-shadow:0 2px 0 var(--gray-btn-d)}
.btn.pri{background:var(--green);box-shadow:0 4px 0 var(--green-d)}
.btn.pri:active{box-shadow:0 2px 0 var(--green-d)}
.btn.big{font-size:20px;padding:14px 24px;width:100%}
.btn.sm{padding:6px 12px;font-size:13.5px;box-shadow:0 3px 0 var(--gray-btn-d)}
.btn.pri.sm{box-shadow:0 3px 0 var(--green-d)}
.btn.ghost{background:transparent;box-shadow:none;color:var(--fg2)}
.btn.ghost:hover{background:var(--hover);color:var(--fg)}
.btn:disabled{opacity:.45;cursor:default}
.icon-btn{background:transparent;border:0;color:var(--fg2);cursor:pointer;padding:6px;border-radius:5px;display:inline-grid;place-items:center;font-size:18px}
.icon-btn:hover{background:var(--hover);color:var(--fg)}

/* ---------- Entrenador (globo de diálogo) ---------- */
.coach{display:flex;gap:10px;align-items:flex-start}
.coach .face{width:52px;height:52px;flex:none;border-radius:6px;overflow:hidden;background:#3a5a7a}
.coach .face svg{width:100%;height:100%;display:block}
.coach .face{position:relative}
.coach .face .hide{position:absolute;top:2px;right:2px;width:18px;height:18px;border:0;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;font-size:10px;cursor:pointer;display:none;padding:0;line-height:18px}
.coach .face:hover .hide,.coach .face:focus-within .hide{display:block}
@media (hover:none){.coach .face .hide{display:block}}
.coach.nofc .bub::before{display:none}
.coach .bub{position:relative;flex:1;min-width:0;background:#fff;color:#312e2b;border-radius:8px;padding:10px 12px;font-size:14.5px;line-height:1.45;animation:slidein .25s}
.coach .bub::before{content:"";position:absolute;left:-7px;top:16px;border:7px solid transparent;border-left:0;border-right-color:#fff}
.coach .bub .hd{display:flex;align-items:center;gap:6px;font-weight:800;margin-bottom:2px}
.coach .bub .hd .ok{width:18px;height:18px;border-radius:50%;background:#81b64c;color:#fff;display:grid;place-items:center;font-size:11px}
.coach .bub .hd .ko{width:18px;height:18px;border-radius:50%;background:#ca3431;color:#fff;display:grid;place-items:center;font-size:11px}
.coach .bub .mv{background:#eceae6;color:#312e2b}
.dlg-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));animation:fi .15s}
.dlg{position:relative;background:var(--panel);border-radius:10px;padding:22px;width:min(440px,100%);max-height:100%;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.6);animation:slidein .2s}
.dlg-x{position:absolute;top:8px;right:8px}
.fl{display:grid;gap:4px;font-size:13px;font-weight:800;color:var(--fg2)}
.fl input{font-size:16px;padding:11px 12px}
.acct{display:grid;gap:4px;font-size:12.5px}
.acct-mail{color:var(--fg);font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acct-st{color:var(--fg3)} .acct-st.ok{color:var(--green-h)} .acct-st.error,.acct-st.notable{color:#f07a77}
.acct .btn{justify-self:start;padding:4px 0}
.upd-bar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:#fff;color:#222;border-radius:10px;padding:10px 12px 10px 16px;display:flex;gap:12px;align-items:center;font-weight:800;box-shadow:0 10px 30px rgba(0,0,0,.5);z-index:150;max-width:calc(100% - 32px)}
.ptags{display:flex;flex-wrap:wrap;gap:4px;margin:2px 0 6px}
.ptag{display:inline-flex;align-items:center;padding:1px 8px;border-radius:20px;font-size:12px;font-weight:800;color:#fff;background:var(--pc,#5c8bb0);white-space:nowrap}
.ptags .ptag{cursor:help}
.pdesc{margin-top:8px;padding-top:8px;border-top:1px solid #e6e3df;display:grid;gap:4px;font-size:13px;color:#5d5a57}
.pdesc b{color:#312e2b}
.mv-w{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.mtag{font-size:10.5px;font-weight:800;color:var(--pc);opacity:.95;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.moves .m.cur .mtag,.moves .m:hover .mtag{color:#fff}
.chal{display:flex;flex-direction:column;gap:6px}
.chal .t{display:flex;justify-content:space-between;font-weight:800;font-size:14px}
.chal .bar{height:10px;background:var(--bg3);border-radius:10px;overflow:hidden}
.chal .bar div{height:100%;background:var(--green);transition:width .4s}

/* ---------- Tarjetas y paneles ---------- */
.card{background:var(--panel);border-radius:8px;padding:18px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.page-h h1{font-size:28px;font-weight:900;letter-spacing:-.4px}
.page-h p{color:var(--fg2);margin:4px 0 0;max-width:70ch}
.muted{color:var(--fg2)} .dim{color:var(--fg3)}
.tag{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;background:var(--hover);color:var(--fg2);font-size:12px;font-weight:700;white-space:nowrap}
.tag.g{background:rgba(129,182,76,.18);color:var(--green-h)}
.tag.r{background:rgba(202,52,49,.2);color:#f07a77}
.tag.y{background:rgba(240,193,92,.18);color:var(--yellow)}
.tag.b{background:rgba(92,139,176,.2);color:#8fb7d8}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tile{background:var(--panel);border-radius:8px;padding:14px 16px;cursor:pointer;transition:background .12s,transform .12s;border:0;color:inherit;text-align:left;font:inherit;display:flex;flex-direction:column;gap:6px;text-decoration:none}
.tile:hover{background:var(--hover)}
.tile h3{font-size:16.5px;font-weight:800}
.tile p{margin:0;color:var(--fg2);font-size:13.5px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:0;background:var(--gray-btn);color:var(--fg2);padding:6px 12px;border-radius:20px;font-weight:700;font-size:13px;cursor:pointer}
.chip.on{background:var(--green);color:#fff}
.chip:hover{filter:brightness(1.15)}
input[type=text],input[type=number],select,textarea{background:var(--bg3);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;font:inherit;font-size:14px;max-width:100%}
textarea{width:100%;min-height:90px;resize:vertical;font-family:ui-monospace,Menlo,monospace;font-size:13px}
label.ck{display:inline-flex;gap:8px;align-items:center;color:var(--fg2);font-size:14px;cursor:pointer}

/* ---------- Pantalla de juego: tablero + panel ---------- */
.play{display:grid;grid-template-columns:minmax(0,auto) minmax(300px,420px);gap:20px;align-items:start;justify-content:center}
.board-col{display:flex;flex-direction:column;gap:8px;min-width:0}
.board-row{display:flex;gap:8px;align-items:stretch}
.board-box{width:min(calc(100vh - 150px),760px);max-width:100%;min-width:0;position:relative}
.player{display:flex;align-items:center;gap:10px;font-weight:800;font-size:14.5px;min-height:36px}
.player .av{width:36px;height:36px;border-radius:4px;background:var(--hover);display:grid;place-items:center}
.player .av svg{width:30px;height:30px}
.player .clock{margin-left:auto;background:var(--bg3);color:var(--fg2);font-variant-numeric:tabular-nums;font-size:20px;font-weight:800;padding:4px 12px;border-radius:5px;min-width:96px;text-align:right}
.player .clock.on{background:#fff;color:#111}
.player .clock.low{background:var(--red);color:#fff}
.side-panel{background:var(--panel);border-radius:8px;display:flex;flex-direction:column;min-height:480px;max-height:calc(100vh - 60px);overflow:hidden;min-width:0}
.sp-head{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);font-weight:900;font-size:18px}
.sp-head svg{width:30px;height:30px}
.sp-body{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:12px;min-height:0}
.sp-body>*{flex-shrink:0}
.sp-foot{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;background:var(--bg3)}
.sp-tabs{display:flex;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.sp-tabs button{flex:1 0 auto;white-space:nowrap;background:none;border:0;color:var(--fg3);padding:12px 6px;font-weight:800;font-size:13.5px;cursor:pointer;border-bottom:3px solid transparent}
.sp-tabs button.on{color:var(--fg);border-bottom-color:var(--green)}

/* ---------- Tablero ---------- */
.cb{position:relative;width:100%;aspect-ratio:1/1;max-width:100%;user-select:none;-webkit-user-select:none;touch-action:none;border-radius:3px;overflow:hidden;box-shadow:0 6px 24px rgba(0,0,0,.35)}
.cb-squares{position:absolute;inset:0;display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr)}
.cb-sq{position:relative}
.cb-sq.light{background:var(--sq-l)} .cb-sq.dark{background:var(--sq-d)}
.cb-sq.last::before,.cb-sq.sel::before{content:"";position:absolute;inset:0;background:var(--last);animation:fi .18s ease-out}
.cb-sq.check::after{content:"";position:absolute;inset:0;background:radial-gradient(circle,#ff0000 0%,#e70000 25%,rgba(169,0,0,0) 89%,rgba(158,0,0,0) 100%);animation:chk 1.2s ease-in-out infinite alternate}
@keyframes chk{from{opacity:.75}to{opacity:1}}
.cb-sq.mark::after{content:"";position:absolute;inset:0;background:rgba(235,97,80,.8)}
.cb-sq.over::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 0 4px rgba(255,255,255,.65)}
.cb-sq.flash-good::after{content:"";position:absolute;inset:0;background:rgba(129,182,76,.75);animation:fl .9s forwards}
.cb-sq.flash-bad::after{content:"";position:absolute;inset:0;background:rgba(202,52,49,.75);animation:fl .9s forwards}
.cb-sq.hl::before{content:"";position:absolute;inset:0;background:rgba(92,139,176,.55)}
@keyframes fl{0%{opacity:1}100%{opacity:0}}
.co{position:absolute;font-size:clamp(9px,1.6vw,13px);font-weight:800;line-height:1;pointer-events:none}
.co-r{top:4%;left:5%} .co-f{bottom:4%;right:6%}
.co-all{position:absolute;left:0;right:0;bottom:6%;text-align:center;font-size:clamp(8px,1.35vw,12px);font-weight:800;pointer-events:none;opacity:.75;z-index:3}
.cb-sq.light .co-all{color:var(--coord-l)} .cb-sq.dark .co-all{color:var(--coord-d)}
.cb-sq.light .co{color:var(--coord-l)} .cb-sq.dark .co{color:var(--coord-d)}
.hint{position:absolute;left:50%;top:50%;width:33%;height:33%;transform:translate(-50%,-50%);border-radius:50%;background:rgba(0,0,0,.14);pointer-events:none;z-index:1;animation:hdot .16s ease-out}
@keyframes hdot{from{transform:translate(-50%,-50%) scale(.3);opacity:0}to{transform:translate(-50%,-50%) scale(1);opacity:1}}
.hintc{position:absolute;inset:0;border-radius:50%;box-shadow:inset 0 0 0 calc(var(--bs,60px)*.09) rgba(0,0,0,.14);border:6px solid rgba(0,0,0,.14);pointer-events:none;z-index:1;animation:fi .16s ease-out}
.cb-pieces{position:absolute;inset:0;pointer-events:none}
.cb-pc{position:absolute;left:0;top:0;width:12.5%;height:12.5%;transition:transform .2s cubic-bezier(.22,1,.36,1),opacity .2s;will-change:transform;z-index:2;cursor:grab}
.cb-pc svg{transition:transform .18s cubic-bezier(.22,1,.36,1),filter .18s}
.cb-pc.ghost{opacity:.35;z-index:1}
.cb-pc.settle svg{animation:settle .22s cubic-bezier(.22,1,.36,1)}
@keyframes settle{0%{transform:scale(1.12)}100%{transform:scale(1)}}
.cb-pc img{width:100%;height:100%;display:block;object-fit:contain;-webkit-user-drag:none;transition:transform .18s cubic-bezier(.22,1,.36,1)}
.cb-pc.dragging img{transform:scale(1.14) translateY(-4%)}
.cb-pc svg{width:100%;height:100%;display:block;filter:drop-shadow(0 1px 1px rgba(0,0,0,.18))}
.cb-pc.noanim{transition:none!important}
.cb-pc.dragging{transition:none;z-index:50;transform-origin:center;cursor:grabbing}
.cb-pc.dragging svg{transform:scale(1.14) translateY(-4%);filter:drop-shadow(0 8px 10px rgba(0,0,0,.35))}
.cb-pc.fadein svg{animation:pin .28s cubic-bezier(.22,1,.36,1)}
@keyframes pin{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
.cb-pc.fadeout{opacity:0;transition:opacity .24s ease}
.cb-pc.fadeout svg{transform:scale(.55)}
@keyframes fi{from{opacity:0}to{opacity:1}}
.cb.blind .cb-pc{opacity:0!important}
.cb-arrows{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:4}
.cb-overlay{position:absolute;inset:0;pointer-events:none;z-index:6}
.cb-overlay>*{pointer-events:auto}
.cb-promo{position:absolute;width:12.5%;display:flex;flex-direction:column;background:#fff;box-shadow:0 4px 18px rgba(0,0,0,.5);border-radius:3px;animation:fi .15s;z-index:10}
.cb-promo button{border:0;background:#fff;aspect-ratio:1;cursor:pointer;padding:6%}
.cb-promo button:hover{background:#e7e7e7}
.cb-promo button.x{aspect-ratio:auto;padding:4px;color:#666;font-size:14px;background:#f1f1f1}
.cb-promo svg{width:100%;height:100%}
.cb-badge{position:absolute;width:5.2%;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:900;font-size:clamp(9px,1.5vw,15px);box-shadow:0 2px 3px rgba(0,0,0,.4);animation:pop .35s cubic-bezier(.3,1.6,.5,1);pointer-events:none;letter-spacing:-1px;border:2px solid rgba(255,255,255,.85)}
@keyframes pop{0%{transform:scale(0)}100%{transform:scale(1)}}

/* Barra de evaluación */
.evalbar{width:26px;flex:none;border-radius:3px;overflow:hidden;background:#403d39;position:relative}
.evalbar .w{position:absolute;left:0;right:0;bottom:0;background:#fff;transition:height .6s cubic-bezier(.3,.8,.3,1)}
.evalbar.flip .w{bottom:auto;top:0}
.evalbar .t{position:absolute;left:0;right:0;font-size:10.5px;font-weight:900;text-align:center;z-index:2}
.evalbar .t.bot{bottom:4px;color:#403d39} .evalbar .t.top{top:4px;color:#fff}

/* Mensajes de feedback de puzles */
.fb{display:flex;align-items:center;gap:12px;padding:14px;border-radius:8px;background:var(--bg3);font-weight:800;font-size:16px;animation:slidein .25s}
.fb .dot{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;flex:none;font-size:20px;color:#fff}
.fb.ok .dot{background:var(--green)} .fb.bad .dot{background:var(--red)} .fb.info .dot{background:var(--hover)} .fb.win .dot{background:var(--teal)}
.fb small{display:block;font-weight:600;color:var(--fg2);font-size:13px}
@keyframes slidein{from{transform:translateY(6px);opacity:0}to{transform:none;opacity:1}}

/* Lista de jugadas */
.moves{display:grid;grid-template-columns:42px 1fr 1fr;font-size:14px;font-weight:700;background:var(--bg3);border-radius:6px;overflow:hidden}
.moves .n{color:var(--fg3);padding:5px 8px;background:var(--bg2)}
.moves .m{padding:5px 8px;cursor:pointer;display:flex;align-items:center;gap:6px;border-radius:3px}
.moves .m:hover{background:var(--hover)}
.moves .m.cur{background:#4b4847;color:#fff}
.moves .m .bd{width:16px;height:16px;border-radius:50%;font-size:9px;display:grid;place-items:center;color:#fff;flex:none}
.nav-btns{display:flex;gap:4px}
.nav-btns .btn{flex:1}

/* Barras de estadística */
.statbar{display:flex;height:22px;border-radius:4px;overflow:hidden;font-size:12px;font-weight:800}
.statbar>div{display:grid;place-items:center;min-width:0;overflow:hidden;white-space:nowrap;transition:flex-grow .5s}
.statbar .sw{background:#f0f0f0;color:#333}.statbar .sd{background:#8b8987;color:#fff}.statbar .sb{background:#403d39;color:#fff}
.meter{height:8px;background:var(--bg3);border-radius:8px;overflow:hidden}
.meter>div{height:100%;background:var(--green);border-radius:8px;transition:width .5s}
.big-num{font-size:34px;font-weight:900;letter-spacing:-1px;font-variant-numeric:tabular-nums;line-height:1.1}
.kv{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv:last-child{border:0}
.kv b{font-variant-numeric:tabular-nums}

/* Contenido largo */
.prose{color:var(--fg2);max-width:76ch}
.prose p{margin:0 0 .8em}
.prose h4{color:var(--fg);font-size:16px;margin:1.1em 0 .4em}
.prose b{color:var(--fg)}
.prose ul{padding-left:1.2em;margin:.3em 0 .9em}
.prose li{margin:.25em 0}
.mv{font-weight:800;color:var(--fg);background:var(--hover);padding:0 4px;border-radius:3px;white-space:nowrap}
.pc-list{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pc-list ul{margin:6px 0 0;padding-left:1.1em;color:var(--fg2);font-size:14px}
.pc-list li{margin:3px 0}
.pc-list h4{font-size:14px;display:flex;align-items:center;gap:6px}
.pros h4{color:var(--green-h)} .cons h4{color:#f07a77}
.sec-t{font-size:12px;text-transform:uppercase;letter-spacing:1.3px;color:var(--fg3);font-weight:900;margin:4px 0 0}
.comment-box{background:var(--bg3);border-radius:6px;padding:12px 14px;color:var(--fg2);font-size:14.5px;min-height:64px;border-left:3px solid var(--green)}
.comment-box b{color:var(--fg)}
table.t{border-collapse:collapse;width:100%;font-size:14px}
table.t th,table.t td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.t th{color:var(--fg3);font-size:12px;text-transform:uppercase;letter-spacing:1px}
table.t td{color:var(--fg2)}
.tscroll{overflow-x:auto}
details.acc{background:var(--panel);border-radius:8px;margin-bottom:10px}
details.acc summary{cursor:pointer;padding:14px 18px;font-weight:800;font-size:16px;list-style:none;display:flex;justify-content:space-between;gap:10px}
details.acc summary::after{content:"＋";color:var(--fg3)}
details.acc[open] summary::after{content:"－"}
details.acc>div{padding:0 18px 16px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#fff;color:#111;padding:10px 18px;border-radius:8px;font-weight:800;box-shadow:0 8px 30px rgba(0,0,0,.4);z-index:100;animation:slidein .2s}
.heat{display:grid;grid-template-columns:repeat(53,1fr);gap:2px}
.heat div{aspect-ratio:1;border-radius:2px;background:var(--bg3)}
.streak{display:flex;align-items:center;gap:6px;font-weight:900}
.rush-strikes{display:flex;gap:6px}
.rush-strikes span{width:26px;height:26px;border-radius:50%;background:var(--bg3);display:grid;place-items:center;color:var(--fg3);font-weight:900}
.rush-strikes span.x{background:var(--red);color:#fff;animation:pop .3s}
.rush-list{display:flex;flex-wrap:wrap;gap:4px}
.rush-list span{width:28px;height:28px;border-radius:5px;display:grid;place-items:center;font-size:11px;font-weight:800;animation:pop .25s}
.rush-list .ok{background:var(--green)} .rush-list .ko{background:var(--red)}
.vision-target{font-size:64px;font-weight:900;text-align:center;letter-spacing:-2px;animation:pop .2s}
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:20px;align-items:stretch}
.hero-main{background:linear-gradient(135deg,#2b3a22,#262522 60%);border-radius:10px;padding:26px;display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden}
.hero-main h1{font-size:34px;font-weight:900;letter-spacing:-.6px;max-width:18ch}
.hero-main .bgk{position:absolute;right:-30px;bottom:-40px;width:230px;opacity:.08}
.mini-board{width:100%;max-width:340px}
.list-row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:8px;background:var(--panel);cursor:pointer;transition:background .12s;text-decoration:none;color:inherit}
.list-row:hover{background:var(--hover)}
.list-row .grow{flex:1;min-width:0}
.list-row h3{font-size:15.5px;font-weight:800}
.list-row p{margin:2px 0 0;color:var(--fg2);font-size:13px}
.eco{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--fg3);font-weight:700}
.lines{display:flex;flex-direction:column;gap:4px;font-size:13px}
.lines div{background:var(--bg3);padding:6px 8px;border-radius:5px;display:flex;gap:8px;overflow:hidden;white-space:nowrap}
.lines b{min-width:46px;display:inline-block;text-align:center;border-radius:3px;padding:0 4px}
.lines .pw{background:#fff;color:#222}.lines .pb{background:#403d39;color:#fff}
.acc-grid{display:grid;grid-template-columns:1fr auto auto;gap:6px 12px;font-size:14px;align-items:center}
.acc-grid .lbl{display:flex;align-items:center;gap:8px;color:var(--fg2)}
.acc-grid .bd{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:900;font-size:10px}
.acc-big{display:flex;justify-content:space-around;gap:10px;text-align:center}
.acc-big .v{font-size:26px;font-weight:900;padding:6px 14px;border-radius:6px;font-variant-numeric:tabular-nums}
.acc-big .vw{background:#fff;color:#222} .acc-big .vb{background:#403d39;color:#fff}
svg.chart{width:100%;height:auto;display:block}

/* ---------- Responsive ---------- */
@media (max-width:1100px){
  .play{grid-template-columns:minmax(0,1fr)}
  .board-box{width:min(100%,640px);margin:0 auto}
  .side-panel{max-height:none;min-height:0}
  .hero{grid-template-columns:1fr}
}
@media (max-width:860px){
  .side{position:fixed;left:0;top:0;bottom:0;transform:translateX(-100%);transition:transform .2s;box-shadow:4px 0 30px rgba(0,0,0,.5);width:230px;padding-top:env(safe-area-inset-top,0px)}
  .side.open{transform:none}
  .topbar{display:flex;align-items:center;gap:10px;position:sticky;top:env(safe-area-inset-top,0px);z-index:15;background:var(--bg3);padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));margin:-20px calc(-1*max(16px,env(safe-area-inset-right,0px))) 16px calc(-1*max(16px,env(safe-area-inset-left,0px)))}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg3)}
  .topbar .logo{padding:0;font-size:17px}
  .g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .board-box{width:100%}
  .evalbar{width:16px}
}
@media (max-width:560px){
  .g2,.g3,.g4,.pc-list{grid-template-columns:minmax(0,1fr)}
  .page-h h1{font-size:23px}
  .hero-main h1{font-size:26px}
  .btn.big{font-size:17px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
